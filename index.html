<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MADINA — 18th Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#f7f2ec;font-family:Montserrat,Arial,sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:radial-gradient(circle at 50% 12%,#403832 0,#181614 40%,#090909 100%)}
.card{width:min(580px,100%);min-height:850px;padding:52px 25px;border:1px solid #fff2;border-radius:30px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:0 25px 90px #000b}
.kicker{font-size:10px;letter-spacing:6px;text-transform:uppercase;opacity:.62}
.name{font-family:"Cormorant Garamond",serif;font-size:67px;letter-spacing:7px;font-weight:500;margin:25px 0 0}
.age{font-family:"Cormorant Garamond",serif;font-size:100px;line-height:.75;margin:12px 0}
.sub{font-family:"Cormorant Garamond",serif;font-size:29px}.line{width:55px;height:1px;background:#fff8;margin:28px auto}
.date{font-family:"Cormorant Garamond",serif;font-size:34px}
.time{font-family:"Cormorant Garamond",serif;font-size:22px;opacity:.85;margin-top:2px}
.details{font-size:13px;line-height:2.1;letter-spacing:.5px}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:36px 0 27px}.unit{border:1px solid #fff2;border-radius:12px;padding:11px 2px}
.num{font-family:"Cormorant Garamond",serif;font-size:30px}.label{font-size:7px;letter-spacing:1.5px;opacity:.5}
button{border:0;background:#f7f2ec;color:#171515;border-radius:999px;padding:16px 28px;font:500 11px Montserrat;letter-spacing:2px;cursor:pointer}
#message{font-size:11px;opacity:.7;margin-top:14px;min-height:17px}.note{font-family:"Cormorant Garamond",serif;font-size:21px;margin-top:30px}
@media(max-width:420px){.name{font-size:53px}.age{font-size:82px}.card{min-height:780px}}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="kicker">you are invited to</div>
<div class="name">MADINA’S</div>
<div class="age">18</div>
<div class="sub">birthday celebration</div>
<div class="line"></div>
<div class="details">
  <div class="date">12 September 2026</div>
  <div class="time">19:00</div>
  <div>Restaurant «SAT»</div>
  <div>Dress code — главное, чтобы были красивыми ✨</div>
</div>
<div class="timer">
  <div class="unit"><span class="num" id="days">00</span><br><span class="label">DAYS</span></div>
  <div class="unit"><span class="num" id="hours">00</span><br><span class="label">HOURS</span></div>
  <div class="unit"><span class="num" id="minutes">00</span><br><span class="label">MINUTES</span></div>
  <div class="unit"><span class="num" id="seconds">00</span><br><span class="label">SECONDS</span></div>
</div>
<button onclick="rsvp()">Я ПРИДУ ♡</button>
<div id="message"></div>
<div class="note">Буду рада провести этот особенный день вместе с тобой.</div>
</main></div>
<script>
const target = new Date("2026-09-12T19:00:00+05:00").getTime();
function update(){
 const diff=Math.max(0,target-Date.now());
 const d=Math.floor(diff/86400000);
 const h=Math.floor(diff%86400000/3600000);
 const m=Math.floor(diff%3600000/60000);
 const s=Math.floor(diff%60000/1000);
 document.getElementById("days").textContent=String(d).padStart(2,"0");
 document.getElementById("hours").textContent=String(h).padStart(2,"0");
 document.getElementById("minutes").textContent=String(m).padStart(2,"0");
 document.getElementById("seconds").textContent=String(s).padStart(2,"0");
}
setInterval(update,1000);update();
function rsvp(){
 window.open("https://docs.google.com/forms/d/e/1FAIpQLSciyRZp4jPxLilKbUlc-ahbZuKAEDLIfSbESRwv9pU6rNIh_Q/viewform","_blank");
 document.getElementById("message").textContent="Открылось подтверждение ♡ Введи своё имя и нажми Submit.";
}
</script>
</body>
</html>
